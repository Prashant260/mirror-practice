name: Sync From Bitbucket

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Bitbucket Mirror
        run: |
          BB_USERNAME_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${{ secrets.BB_USERNAME }}', safe=''))")
          BB_PASSWORD_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${{ secrets.BB_APP_PASSWORD }}', safe=''))")
          git clone --mirror "https://${BB_USERNAME_ENCODED}:${BB_PASSWORD_ENCODED}@bitbucket.org/${{ secrets.BB_WORKSPACE }}/${{ secrets.BB_REPO }}.git"

      - name: Configure Git
        run: |
          git config --global user.name "prashant260"
          git config --global user.email "prashantagchouhdary2004@gmail.com"

      - name: Push to GitHub
        run: |
          cd ${{ secrets.BB_REPO }}.git

          git push --mirror https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git